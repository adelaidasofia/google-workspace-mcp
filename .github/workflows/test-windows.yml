name: test-windows
# Hand-maintained, deliberately separate from test.yml.
#
# test.yml is generated by gh-harden-repos.sh and says so at the top, so this
# cannot live there without being reverted on the next regeneration. It is also
# a different gate: test.yml proves the suite passes on Linux, and every Windows
# bug this repo has had was invisible on Linux -- a UTC time zone that is a
# valid zone, a chmod that returns success without restricting anything, a
# filename that is legal on one filesystem and an OSError on another. None of
# those go red on ubuntu-latest.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: test-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest tests/ -v
          code=$?
          set -e
          # Exit 5 = pytest collected 0 tests. Not tolerated, for the same
          # reason test.yml does not tolerate it: a gate that ran nothing
          # reports exactly the same green as a gate that passed.
          if [ "$code" = "5" ]; then
            echo "::error title=No tests collected::pytest exited 5 -- it collected 0 tests. A gate that ran nothing is not a gate that passed."
            exit 1
          fi
          exit "$code"

      - name: The Windows-only tests actually ran
        shell: bash
        run: |
          # The suite is full of skipif(os.name != "nt"). If those silently
          # stopped matching -- a renamed marker, a moved file -- this job
          # would stay green while testing nothing that Linux does not already
          # cover, which is the one failure mode it exists to rule out.
          out="$(pytest tests/test_install_ps1.py tests/test_windows_compat.py -q 2>&1)"
          echo "$out"
          echo "$out" | grep -qE '[1-9][0-9]* passed' || {
            echo "::error title=Windows suite ran nothing::the Windows-specific tests all skipped"
            exit 1
          }
