[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-mcp"
version = "0.1.0"
description = "FastMCP server exposing Google Workspace (Gmail, Calendar, Drive, Docs, Sheets) tools."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.199.0",
    "keyring>=25.7.0",
    # Local IANA zone on Windows, which has no /etc/localtime.
    "tzlocal>=5.0",
    # zoneinfo has no system tz database on Windows.
    "tzdata>=2026.3; sys_platform == 'win32'",
]

# Flat layout (modules at repo root). List them explicitly so the editable
# build is deterministic and setuptools does not fail discovery with
# "Multiple top-level modules discovered in a flat-layout".
[tool.setuptools]
py-modules = ["accounts", "audit", "calendar_tools", "docs_tools", "drive_tools", "gmail_tools", "server", "sheets_tools"]
